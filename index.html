textarea,input[type=text]{width:100%;border:1.5px solid var(--line);border-radius:14px;padding:11px 12px;font:inherit;font-size:15px;background:#fff;color:var(--ink);resize:none;outline:none}

.wave{display:flex;gap:5px;justify-content:center;align-items:flex-end;height:60px;margin:20px 0}
.wave i{width:6px;border-radius:4px;background:var(--accent2);height:12px}
.wave.on i{animation:w 1.2s ease-in-out infinite}

.toast{position:fixed;left:50%;bottom:90px;transform:translateX(-50%);background:var(--ink);color:#fff;padding:9px 16px;border-radius:99px;font-size:13.5px;z-index:40;opacity:0;transition:.25s;pointer-events:none;white-space:nowrap}

.letter{background:#fff;border:1px solid var(--line);border-radius:16px;padding:18px;font-size:15.5px;line-height:1.9;white-space:pre-wrap;margin:12px 0;background-image:repeating-linear-gradient(transparent 0 28px,#F4EAE0 28px 29px)}
.hide{display:none!important}
svg text{font-family:inherit}
</style>
</head>

 const entries=s.map((r,i)=>{const t=now-r[0]*D-(new Date().getHours()-r[1])*36e5;return{id:'s'+i,t:Math.min(t,now-6e5),mood:r[2],lvl:r[3],text:r[4],triggers:r[5],mode:r[6],tool:r[7],fb:r[8],reply:makeReply({mood:r[2],lvl:r[3],text:r[4],triggers:r[5],mode:r[6]})}}).sort((a,b)=>b.t-a.t);

/* ========== 工具函数 ========== */
const $=s=>document.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
function toast(m){const t=$('#toast');t.textContent=m;t.classList.add('show');clearTimeout(t._t);t._t=setTimeout(()=>t.classList.remove('show'),1800)}
function fmt(t){const d=new Date(t),n=new Date();const hm=d.toTimeString().slice(0,5);const dd=Math.round((new Date(n.toDateString())-new Date(d.toDateString()))/864e5);return(dd===0?'今天':dd===1?'昨天':`${d.getMonth()+1}月${d.getDate()}日`)+' '+hm}
function detect(text){return Object.keys(TRIG).filter(k=>TRIG[k].test(text||''))}
function score(e){const v=MOOD[e.mood]?.v??0;return Math.max(1,Math.min(5,3+v*(.4*e.lvl)))}
function effect(){const m={};(DB.toolLog||[]).forEach(l=>{m[l.tool]=m[l.tool]||{n:0,good:0,bad:0};m[l.tool].n++;if(l.fb==='better')m[l.tool].good++;if(l.fb==='worse')m[l.tool].bad++});return m}

/* ========== 推荐 & 回应（原型：本地规则生成） ========== */
function recommend(e){
 const list=REC[e.mood]||REC['说不清'],eff=effect(),sc={};
 Object.keys(TOOLS).forEach(id=>{let s=0,why='';const i=list.indexOf(id);if(i>=0){s+=10-i*1.5;why=`适合${e.mood}的时候`}
  if((MODECAT[e.mode]||[]).includes(TOOLS[id].cat))s+=3;
  (e.triggers||[]).forEach(t=>{if((TRIGBOOST[t]||[]).includes(id)){s+=2;why=why||`常用于缓解${t}压力`}});
  const f=eff[id];if(f&&f.n>=2){const r=(f.good-f.bad)/f.n;s+=r*5;if(r>.5)why=`之前 ${f.n} 次里有 ${f.good} 次让你好一点`}
  sc[id]={s,why}});
 return Object.keys(sc).sort((a,b)=>sc[b].s-sc[a].s).slice(0,3).map(id=>({id,why:sc[id].why}));
}
const SCENE={学业:'学业的压力常常是一件接一件的',工作:'工作上的事很容易一直挂在心上',人际:'和人有关的事最容易让人反复去想',家庭:'家里的事往往最难说出口',恋爱:'感情里的起伏很牵动人',身体:'身体不舒服的时候，情绪也会跟着变重',睡眠:'没睡好的时候，什么事都会显得更难',金钱:'钱的压力很现实，也很磨人'};
const FEEL={焦虑:'心里悬着、静不下来',低落:'提不起劲、心里沉沉的',烦躁:'憋着一股火',疲惫:'累到不想动',说不清:'有点乱、说不太清楚',平静:'挺平静',开心:'开心',感激:'心里暖暖的'};
const WORRY={学业:'担心结果不好，或者觉得时间不够用',工作:'担心被评价、怕自己做不好',人际:'在意别人怎么看你，或担心关系会变',家庭:'想被理解，又怕起冲突',恋爱:'担心失去，或不确定对方的想法',身体:'担心身体，或因为不舒服做不了事',睡眠:'担心明天的状态撑不住',金钱:'担心不够用、没有安全感'};
function makeReply(e){
 const t=(e.triggers||[])[0],txt=(e.text||'').trim(),pos=['平静','开心','感激'].includes(e.mood);
 const q=txt?`「${txt.length>26?txt.slice(0,26)+'…':txt}」`:'';
 const feel=FEEL[e.mood]||'有些复杂';
 if(e.mode==='clarify'){
  return `我们试着把它分开来看：\n\n· 发生的事：${txt||'还没写，没关系'}\n· 你的感受：${e.mood||'说不清'}，强度 ${e.lvl}/5\n· 背后可能的担心：${pos?'没有担心也很好，可以想想是什么让你这样':(WORRY[t]||'还没找到具体的点，这很正常')}\n\n${pos?'记下让你感觉好的事情，以后难受时可以回来看看。':'想一想：这里面哪一部分是你现在能影响的？哪一部分可以先放一放？'}`;
 }
 if(e.mode==='act'){
  return pos?`${q?'看到你写'+q+'，':''}真好。趁现在状态不错，可以做一件小事把这份感觉留住：比如出去走走，或者给自己写一句话。`
   :`${q?'关于'+q+'，':''}先不用一次解决全部。${e.lvl>=4?'现在情绪比较满，先让身体缓下来，再处理事情。':'选一件 5 分钟内能做到的小事就够了。'}\n\n下面是为你挑的几个方法，按你现在的状态排了序。做完回来告诉我感觉怎么样。`;
 }
 if(pos)return `${q?'听你说'+q+'，':''}真替你高兴。这种${feel}的时刻值得被好好记住。\n\n愿意多说一点吗？今天是什么让你有这样的感觉？`;
 return `${q?'你写下了'+q+'。':''}${SCENE[t]?SCENE[t]+'，':''}会觉得${feel}，是很自然的反应，不代表你不够好。\n\n${e.lvl>=4?'听起来这次挺重的。谢谢你愿意先停下来写一写。':'能把它说出来，已经是在照顾自己了。'}\n\n如果愿意，可以再说说：这件事里最让你难受的是哪一部分？`;
}

 <div class="card" style="margin-top:0">${ins.map(([i,t])=>`<div class="insight"><i>${i}</i><div>${t}</div></div>`).join('')}</div>
 <div class="sec"><h3>情绪日记</h3><span>共 ${E.length} 条 · 点开可编辑</span></div>
 <div class="card" style="margin-top:0;padding-top:4px;padding-bottom:4px">${E.length?E.map(e=>`<div class="entry" data-entry="${e.id}"><span class="em">${MOOD[e.mood].e}</span><div style="flex:1;min-width:0"><div class="mt">${fmt(e.t)} · ${e.mood} ${e.lvl}/5${e.triggers.map(t=>`<span class="pill">${t}</span>`).join('')}${e.fb==='better'?' 🙂':e.fb==='worse'?' 😣':''}</div><div class="tx">${esc(e.text)||'<span style="color:#8C7A6E">（只记录了心情）</span>'}</div></div></div>`).join(''):'<p class="hint" style="padding:12px 0">还没有记录，去「此刻」写下第一句吧。</p>'}</div>
 <div class="sec"><h3>数据与隐私</h3></div>
 <div class="card" style="margin-top:0;font-size:13.5px;color:#8C7A6E">所有记录只保存在当前浏览器（localStorage），不会上传到任何服务器。换设备或清除浏览器数据后记录会消失。
 <div class="row" style="margin-top:12px"><button class="btn ghost sm" data-act="clear">清空所有记录</button><button class="btn ghost sm" data-act="demo">载入示例数据</button></div></div>`;
}

/* ========== 弹层 ========== */
function openSheet(html){$('#sheet').innerHTML=`<button class="x" data-act="close">✕</button>`+html;$('#mask').classList.add('show')}
function closeSheet(){stopAll();$('#mask').classList.remove('show')}
function openSOS(){openSheet(`<h2>你不是一个人</h2><p class="hint">如果你有伤害自己的念头，或觉得撑不下去了，请现在就联系专业的人。他们愿意听你说。</p>
 <div class="crisis"><b>📞 立即可拨打</b>
 <a href="tel:12356"><span>全国心理援助热线</span><b>12356</b></a>
 <a href="tel:4001619995"><span>希望 24 热线（24 小时）</span><b>400-161-9995</b></a>
 <a href="tel:120"><span>有生命危险，请拨打急救</span><b>120 / 110</b></a></div>
 <p style="font-size:14px">也可以现在给一个信任的人发消息，只需要说：「我现在状态不太好，能陪我聊聊吗？」</p>
 <button class="btn block" style="margin-top:14px" data-tool="ground">先和我一起做 3 分钟着陆练习</button>`)}
function openEntry(id){const e=DB.entries.find(x=>x.id===id);if(!e)return;
 openSheet(`<h2>${MOOD[e.mood].e} ${e.mood} · ${e.lvl}/5</h2><p class="hint">${fmt(e.t)} · ${MODES[e.mode]?.n||''}${e.triggers.length?' · '+e.triggers.join('、'):''}</p>
 <div class="label" style="margin-top:14px">我写下的</div><textarea id="edit" rows="3">${esc(e.text)}</textarea>
 <div class="label" style="margin-top:14px">当时的回应</div><div class="bubble">${esc(e.reply)}</div>
 ${e.tool?`<p class="hint" style="margin-top:10px">做过的练习：${TOOLS[e.tool].name}${e.fb?' · 之后感觉'+{better:'好一点了',same:'差不多',worse:'更难受了'}[e.fb]:''}</p>`:''}
 <div class="row" style="margin-top:16px"><button class="btn ghost" data-act="del" data-id="${e.id}">删除</button><button class="btn" data-act="saveedit" data-id="${e.id}">保存修改</button></div>`)}

/* ========== 练习播放器 ========== */
let timers=[],AC=null,snd=null,curTool=null;
function stopAll(){timers.forEach(t=>{clearTimeout(t);clearInterval(t)});timers=[];if(snd){snd.stop();snd=null}}
function openTool(id){stopAll();curTool=id;const t=TOOLS[id];
 const head=`<h2>${t.ic} ${t.name}</h2><p class="hint">${t.desc}</p>`;
 if(t.type==='breath'){openSheet(head+`<div class="stage"><div class="orb" id="orb">准备</div><div id="ph" class="hint">找一个舒服的姿势，点开始</div></div><button class="btn block" id="go">开始</button>`);
  $('#go').onclick=()=>{$('#go').classList.add('hide');let r=0,i=0;const orb=$('#orb');
   const tick=()=>{if(r>=t.rounds)return done();const[n,s]=t.pattern[i];orb.style.transitionDuration=s+'s';orb.style.transform=n.includes('吸')?'scale(1)':n.includes('呼')?'scale(.6)':orb.style.transform;let left=s;orb.textContent=n;$('#ph').textContent=`第 ${r+1}/${t.rounds} 轮 · ${left} 秒`;
    const iv=setInterval(()=>{left--;if(left>0)$('#ph').textContent=`第 ${r+1}/${t.rounds} 轮 · ${left} 秒`},1000);timers.push(iv);
    timers.push(setTimeout(()=>{clearInterval(iv);i++;if(i>=t.pattern.length){i=0;r++}tick()},s*1000))};tick()}}
 else if(t.type==='steps'){let i=0;openSheet(head+`<div class="stage"><div class="big" id="se"></div><h2 id="st"></h2><p id="sx" style="min-height:52px;font-size:15px"></p><div class="prog"><div id="sp"></div></div><div class="hint" id="sc"></div></div><div class="row"><button class="btn ghost" id="prev">上一步</button><button class="btn" id="next">下一步</button></div>`);
  const show=()=>{stopAll();if(i>=t.steps.length)return done();const[e,ti,tx,s]=t.steps[i];$('#se').textContent=e;$('#st').textContent=`${i+1}/${t.steps.length} · ${ti}`;$('#sx').textContent=tx;let left=s;const sp=$('#sp');sp.style.transition='none';sp.style.width='0';
   requestAnimationFrame(()=>{sp.style.transition='width 1s linear'});const up=()=>{$('#sc').textContent=left>=60?`${Math.floor(left/60)} 分 ${left%60} 秒`:`${left} 秒`;sp.style.width=((s-left)/s*100)+'%'};up();
   timers.push(setInterval(()=>{left--;up();if(left<=0){i++;show()}},1000));$('#next').textContent=i===t.steps.length-1?'完成':'下一步'};
  $('#prev').onclick=()=>{if(i>0){i--;show()}};$('#next').onclick=()=>{i++;show()};show()}
 else if(t.type==='sound'){openSheet(head+`<div class="wave" id="wv">${Array.from({length:14},(_,k)=>`<i style="animation-delay:${k*.09}s"></i>`).join('')}</div><p class="hint" style="text-align:center" id="el">点击播放，戴上耳机效果更好</p><div class="row" style="margin-top:14px"><button class="btn" id="pl">▶ 播放</button><button class="btn ghost" id="fin">听好了</button></div>`);
  let sec=0;$('#pl').onclick=()=>{if(snd){snd.stop();snd=null;$('#wv').classList.remove('on');$('#pl').textContent='▶ 播放';stopAll();return}playSound(t.sound);$('#wv').classList.add('on');$('#pl').textContent='❚❚ 暂停';timers.push(setInterval(()=>{sec++;$('#el').textContent=`已经陪你 ${Math.floor(sec/60)} 分 ${sec%60} 秒`},1000))};
  $('#fin').onclick=()=>{stopAll();done()}}
 else if(t.type==='think'){openSheet(head+`<div class="label" style="margin-top:14px">1. 现在最让你烦的那件事是？</div><input type="text" id="k1" placeholder="比如：论文还差结论没写">
  <div class="label" style="margin-top:12px">2. 里面哪一部分是你能控制的？</div><input type="text" id="k2" placeholder="比如：先列出结论的 3 个要点">
  <div class="label" style="margin-top:12px">3. 5 分钟内能做的最小一步是？</div><input type="text" id="k3" placeholder="比如：打开文档，写下第一句话">
  <button class="btn block" style="margin-top:16px" id="kgo">就做这一步</button>`);
  $('#kgo').onclick=()=>{const v=$('#k3').value.trim()||$('#k2').value.trim();if(!v)return toast('写下一小步就好');$('#sheet').innerHTML=`<button class="x" data-act="close">✕</button><div class="stage"><div class="big">🧩</div><h2>你的一小步</h2><div class="letter" style="text-align:left">${esc(v)}</div><p class="hint">不用想后面的事，先完成这一步。做完回来看看感觉。</p></div>${fbButtons()}`}}
 else if(t.type==='kind'){openSheet(head+`<div class="label" style="margin-top:14px">如果你最好的朋友遇到和你一样的事，你会对 TA 说什么？</div><textarea id="kd" rows="4" placeholder="比如：你已经很努力了，一次没做好不代表你不行……"></textarea><button class="btn block" style="margin-top:14px" id="kgo">把这句话送给自己</button>`);
  $('#kgo').onclick=()=>{const v=$('#kd').value.trim();if(!v)return toast('写一句就好');$('#sheet').innerHTML=`<button class="x" data-act="close">✕</button><div class="stage"><div class="big">💌</div><h2>给自己的一封短信</h2></div><div class="letter">亲爱的我：\n${esc(v)}\n\n—— ${new Date().getMonth()+1}月${new Date().getDate()}日，来自也在努力的自己</div><p class="hint" style="text-align:center;margin-bottom:12px">写完之后，感觉怎么样？</p>${fbButtons()}`}}
}
function done(){stopAll();$('#sheet').innerHTML=`<button class="x" data-act="close">✕</button><div class="stage"><div class="big">🌱</div><h2>完成了，你照顾了自己一下</h2><p class="hint" style="margin-bottom:14px">现在感觉怎么样？这会帮助缓一缓更了解你。</p></div>${fbButtons()}`}
function playSound(kind){
 AC=AC||new(window.AudioContext||window.webkitAudioContext)();AC.resume();
 const g=AC.createGain();g.gain.value=0;g.connect(AC.destination);g.gain.linearRampToValueAtTime(kind==='pad'?.9:.45,AC.currentTime+1.5);
 let stopper;
 if(kind==='pad'){const chords=[[130.8,261.6,329.6,392],[110,220,261.6,329.6],[87.3,174.6,220,261.6],[98,196,246.9,293.7]];
  const lp=AC.createBiquadFilter();lp.type='lowpass';lp.frequency.value=1400;lp.connect(g);
  const play=i=>chords[i%4].forEach(f=>{const o=AC.createOscillator(),og=AC.createGain();o.type='triangle';o.frequency.value=f;const t0=AC.currentTime;og.gain.setValueAtTime(0,t0);og.gain.linearRampToValueAtTime(.07,t0+2.5);og.gain.linearRampToValueAtTime(0,t0+8);o.connect(og);og.connect(lp);o.start(t0);o.stop(t0+8.2)});
  let ci=0;play(ci++);const iv=setInterval(()=>play(ci++),6000);stopper=()=>clearInterval(iv)}
 else{const len=AC.sampleRate*3,b=AC.createBuffer(1,len,AC.sampleRate),d=b.getChannelData(0);let last=0;
  for(let i=0;i<len;i++){const w=Math.random()*2-1;if(kind==='brown'){last=(last+.02*w)/1.02;d[i]=last*3.5}else d[i]=w*.6}
  const s=AC.createBufferSource();s.buffer=b;s.loop=true;let n=s;
  if(kind==='rain'){const hp=AC.createBiquadFilter();hp.type='highpass';hp.frequency.value=400;const lp=AC.createBiquadFilter();lp.type='lowpass';lp.frequency.value=2600;s.connect(hp);hp.connect(lp);n=lp;
   const lfo=AC.createOscillator(),lg=AC.createGain();lfo.frequency.value=.12;lg.gain.value=.12;lfo.connect(lg);lg.connect(g.gain);lfo.start();}
  n.connect(g);s.start();stopper=()=>{try{s.stop()}catch(e){}}}
 snd={stop:()=>{const t=AC.currentTime;g.gain.cancelScheduledValues(t);g.gain.setValueAtTime(g.gain.value,t);g.gain.linearRampToValueAtTime(0,t+.4);setTimeout(()=>{stopper();g.disconnect()},500)}};
}
function recordFb(fb){
 if(curTool){DB.toolLog=DB.toolLog||[];DB.toolLog.push({tool:curTool,fb,t:Date.now()});if(cur&&!cur.tool){cur.tool=curTool}}
 if(cur){cur.fb=fb;const e=DB.entries.find(x=>x.id===cur.id);if(e){e.fb=fb;e.tool=cur.tool}}
 save();
}

/* ========== 事件 ========== */
let tab='now';
function go(t){tab=t;document.querySelectorAll('nav button').forEach(b=>b.classList.toggle('on',b.dataset.tab===t));({now:renderNow,tools:renderTools,review:renderReview})[t]();window.scrollTo(0,0)}
document.addEventListener('click',ev=>{
 const el=ev.target.closest('[data-tab],[data-mood],[data-lv],[data-tag],[data-mode],[data-tool],[data-fb],[data-entry],[data-act]');if(!el)return;
 const d=el.dataset;
 if(d.tab)return go(d.tab);
 if(d.mood){draft.text=$('#txt')?.value||draft.text;draft.mood=draft.mood===d.mood?null:d.mood;return renderNow()}
 if(d.lv){draft.lvl=+d.lv;document.querySelectorAll('.lv').forEach(b=>b.classList.toggle('on',+b.dataset.lv===draft.lvl));return}
 if(d.tag){const k=d.tag;if(draft.tags.has(k)){draft.tags.delete(k);draft.removed.add(k)}else{draft.tags.add(k);draft.removed.delete(k)}el.classList.toggle('on');return}
 if(d.mode)return submit(d.mode);
 if(d.tool)return openTool(d.tool);
 if(d.fb){const inSheet=el.closest('#sheet');if(inSheet){recordFb(d.fb);closeSheet();toast(d.fb==='worse'?'辛苦了，换一个方法试试，或者联系信任的人':'已记下，谢谢你照顾自己');if(tab==='now')renderNow();else go(tab);if(d.fb==='worse'&&cur)setTimeout(()=>{},0);return}
  curTool=null;recordFb(d.fb);el.parentNode.querySelectorAll('button').forEach(b=>b.classList.toggle('on',b===el));
  toast(d.fb==='better'?'真好，已经保存到日记':d.fb==='worse'?'抱歉没能帮上忙，试试另一个练习？':'已保存，慢慢来');if(d.fb==='worse')setTimeout(openSOSlite,600);return}
 if(d.entry)return openEntry(d.entry);
 const a=d.act;
 if(a==='close')return closeSheet();
 if(a==='sos')return openSOS();
 if(a==='new'){cur=null;return go('now')}
 if(a==='tab-review'){cur=null;return go('review')}
 if(a==='more'){const v=$('#more').value.trim();if(!v)return;cur.follow=cur.follow||[];const extra=CRISIS.test(v);cur.follow.push({q:v,a:extra?'谢谢你告诉我这些，你现在的感受很重要。请先联系能马上帮到你的人，下面的热线 24 小时都有人在。':FOLLOW[cur.follow.length%FOLLOW.length]});cur.text+=(cur.text?'\n':'')+v;const nt=detect(v).filter(k=>!cur.triggers.includes(k));cur.triggers.push(...nt);save();renderResult();if(extra)setTimeout(openSOS,300);return}
 if(a==='del'){if(!confirm('确定删除这条记录吗？'))return;DB.entries=DB.entries.filter(e=>e.id!==d.id);save();closeSheet();toast('已删除');return go('review')}
 if(a==='saveedit'){const e=DB.entries.find(x=>x.id===d.id);e.text=$('#edit').value.trim();const nt=detect(e.text).filter(k=>!e.triggers.includes(k));e.triggers.push(...nt);save();closeSheet();toast('已保存');return go('review')}
 if(a==='clear'){if(!confirm('清空后无法恢复，确定吗？'))return;DB={entries:[],toolLog:[],sample:false};save();cur=null;toast('已清空，从今天开始吧');return go('review')}
 if(a==='demo'){DB=sample();save();toast('已载入示例数据');return go('review')}
});
function openSOSlite(){openSheet(`<h2>没关系，有时候就是会更难受</h2><p class="hint">这不是你的错。可以试试另一种方式，或者找人聊聊。</p>
 <div class="tools" style="margin-top:14px">${['ground','walk','kind'].filter(id=>id!==cur?.tool).slice(0,2).map(id=>toolCard(id,'换个方式试试')).join('')}</div>
 <button class="sos" data-act="sos">需要找专业的人聊聊 →</button>`)}
$('#mask').addEventListener('click',e=>{if(e.target.id==='mask')closeSheet()});
$('#today').textContent=new Date().toLocaleDateString('zh-CN',{month:'long',day:'numeric',weekday:'short'});
load();go('now');
</script>
