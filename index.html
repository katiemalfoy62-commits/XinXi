<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>心息 · 给心一点喘息的时间</title>
<meta name="description" content="心息 XinXi：情绪日记与自我关怀。说一句就好，小猫息息陪你记录情绪、看见触发因素、用冥想/声音/运动照顾自己。">
<meta name="theme-color" content="#FBF3EA">
<link rel="icon" href="img/avatar-cat.webp">
<link rel="preload" as="image" href="img/cat-default.webp">
<style>
:root{--bg:#FBF3EA;--card:#FFFBF5;--ink:#4A3B32;--sub:#8C7A6E;--line:#F0DCC6;--accent:#E07A50;--accent-d:#CF6338;--accent2:#F2B58C;--soft:#FDEBDD;--gold:#EDB54A}
*{box-sizing:border-box;margin:0;padding:0}
html{-webkit-text-size-adjust:100%}
body{background:var(--bg);color:var(--ink);font-family:-apple-system,"PingFang SC","Microsoft YaHei","Hiragino Sans GB",sans-serif;line-height:1.6;-webkit-font-smoothing:antialiased;background-image:radial-gradient(circle at 10% 0%,#FFF4E8 0,transparent 40%),radial-gradient(circle at 100% 30%,#FCEBDD 0,transparent 35%)}
button{font:inherit;color:inherit;-webkit-tap-highlight-color:transparent}
img{display:block;max-width:100%;height:auto}
.app{max-width:480px;margin:0 auto;min-height:100vh;padding:10px 16px 108px}
header{display:flex;align-items:center;justify-content:space-between;margin:0 -6px 2px}
header .logo{height:52px;width:auto}
header .date{color:var(--sub);font-size:13px;letter-spacing:1px;text-align:right;line-height:1.4}
header .date b{display:block;font-size:11px;font-weight:400;letter-spacing:2px;color:#B7A496}
h1{font-size:23px;font-weight:700;letter-spacing:.5px}
h2{font-size:18px;font-weight:700}
.hint{color:var(--sub);font-size:13.5px}
.card{background:var(--card);border:1.5px solid var(--line);border-radius:22px;padding:16px;margin-top:14px;box-shadow:0 3px 0 rgba(236,205,172,.45),0 10px 26px rgba(160,110,70,.05);position:relative}
.ttl{font-size:15px;font-weight:700;margin-bottom:12px;display:flex;justify-content:space-between;align-items:center;gap:8px}
.ttl small{font-weight:400;color:var(--sub);font-size:12px}
/* 首页 hero */
.hero{display:grid;grid-template-columns:1.2fr 1fr;align-items:end;margin-top:2px;gap:2px}
.hero .cat{width:100%;transform-origin:50% 92%;animation:idle 4.5s ease-in-out infinite}
.say{position:relative;background:#fff;border:1.5px solid var(--line);border-radius:22px;padding:12px 14px;font-size:15px;font-weight:700;line-height:1.5;margin-bottom:46px;box-shadow:0 3px 0 rgba(236,205,172,.45)}
.say::before{content:"";position:absolute;left:-9px;bottom:16px;width:16px;height:16px;background:#fff;border-left:1.5px solid var(--line);border-bottom:1.5px solid var(--line);transform:rotate(45deg);border-radius:0 0 0 4px}
.say span{display:block;font-size:12px;font-weight:400;color:var(--sub);margin-top:2px}
@keyframes idle{50%{transform:scale(1.015,1.035)}}
.lead{text-align:center;color:var(--sub);font-size:13px;margin-top:-2px}
/* 情绪 */
.moods{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.mood{border:1.5px solid var(--line);background:#FFFDF9;border-radius:18px;padding:9px 0 5px;text-align:center;cursor:pointer;font-size:13px;transition:transform .15s,background .15s}
.mood img{width:42px;height:42px;margin:0 auto 2px}
.mood.on{transform:translateY(-2px);font-weight:600}
.levels{display:flex;gap:7px;margin-top:14px;align-items:center}
.levels>span{font-size:12.5px;color:var(--sub);white-space:nowrap;margin-right:2px}
.lv{flex:1;height:34px;border-radius:999px;border:1.5px solid var(--line);background:#FFFDF9;cursor:pointer;font-size:15px;font-weight:600;color:#8C6E5E}
.lv.on{background:var(--accent);border-color:var(--accent-d);color:#fff;box-shadow:0 2px 0 var(--accent-d)}
textarea,input[type=text]{width:100%;border:1.5px solid var(--line);border-radius:18px;padding:12px 14px;font:inherit;font-size:15px;background:#FFFDF9;color:var(--ink);resize:none;outline:none}
textarea:focus,input[type=text]:focus{border-color:var(--accent2);background:#fff}
::placeholder{color:#C2B0A2}
.tags{display:flex;flex-wrap:wrap;gap:7px}
.tag{display:inline-flex;align-items:center;gap:5px;padding:4px 12px 4px 7px;border-radius:999px;border:1.5px solid var(--line);background:#FFFDF9;font-size:13px;cursor:pointer;user-select:none;transition:.15s}
.tag img{width:20px;height:20px}
.tag.auto::before{content:"✦";color:var(--gold);font-size:12px;margin-right:-2px}
.tag.on{font-weight:600}
/* 支持方式 */
.modes{display:grid;gap:10px}
.mode{display:flex;align-items:center;gap:12px;text-align:left;border:1.5px solid var(--line);background:#FFFDF9;border-radius:22px;padding:5px 14px 5px 5px;cursor:pointer;transition:.15s;box-shadow:0 2px 0 rgba(236,205,172,.45)}
.mode img{width:96px;height:66px;object-fit:cover;border-radius:17px;flex:none}
.mode div{flex:1}
.mode b{display:block;font-size:16px}
.mode span{font-size:12px;color:var(--sub)}
.mode i{font-style:normal;color:#C9A994;font-size:20px}
.mode:hover,.mode:active{border-color:var(--accent2);background:#FFF6EE;transform:translateY(-1px)}
/* 按钮 */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;border:1.5px solid var(--accent-d);border-radius:999px;padding:11px 18px;font-size:15px;font-weight:700;cursor:pointer;background:var(--accent);color:#fff;box-shadow:0 3px 0 var(--accent-d);transition:transform .1s}
.btn:active{transform:translateY(2px);box-shadow:0 1px 0 var(--accent-d)}
.btn.ghost{background:#FFF7EF;color:var(--accent-d);border-color:#EBA582;box-shadow:0 3px 0 #F4D3BD}
.btn.sm{padding:6px 14px;font-size:13.5px;box-shadow:0 2px 0 #F4D3BD;white-space:nowrap;flex:none}
.btn.block{width:100%}
.row{display:flex;gap:10px}
.row>.btn:not(.sm){flex:1}
.link{display:block;text-align:center;font-size:13.5px;color:var(--accent-d);margin-top:18px;text-decoration:underline;text-underline-offset:4px;cursor:pointer;background:none;border:none;width:100%}
.foot{font-size:11.5px;color:var(--sub);text-align:center;margin-top:12px;line-height:1.75}
/* 对话 */
.msg{display:flex;gap:9px;align-items:flex-start;margin-top:12px}
.msg .av{width:42px;height:42px;border-radius:50%;flex:none;box-shadow:0 0 0 2px #fff,0 2px 6px rgba(160,110,70,.15)}
.bub{background:#FFFDF9;border:1.5px solid var(--line);border-radius:6px 20px 20px 20px;padding:12px 14px;font-size:15px;line-height:1.75;white-space:pre-wrap;max-width:calc(100% - 52px)}
.msg.me{flex-direction:row-reverse}
.msg.me .bub{background:var(--soft);border-color:#F3C7A8;border-radius:20px 6px 20px 20px}
.who{font-size:12px;color:var(--sub);margin-bottom:2px}
.send{display:flex;align-items:center;gap:6px;background:#FFFDF9;border:1.5px solid var(--line);border-radius:999px;padding:4px 4px 4px 16px;margin-top:14px}
.send input{border:none;background:transparent;padding:8px 0;border-radius:0}
.send input:focus{background:transparent}
.send button{width:40px;height:40px;border-radius:50%;border:none;background:var(--accent);display:grid;place-items:center;cursor:pointer;flex:none;box-shadow:0 2px 0 var(--accent-d)}
.reply-cat{position:absolute;left:14px;top:-62px;width:96px;pointer-events:none}
/* 练习卡 */
.rcards{display:grid;gap:10px}
.rcard{display:flex;gap:11px;align-items:center;border:1.5px solid var(--line);border-radius:22px;padding:10px 6px 10px 12px;background:#FFFDF9;cursor:pointer;text-align:left;width:100%;overflow:hidden;box-shadow:0 2px 0 rgba(236,205,172,.45);transition:.15s}
.rcard:hover{border-color:var(--accent2)}
.rcard .ic{width:46px;height:46px;flex:none}
.rcard .tx{flex:1;min-width:0}
.rcard b{font-size:15.5px}
.rcard .meta{font-size:12px;color:var(--sub);margin-top:1px}
.rcard .why{font-size:12px;color:var(--accent-d);margin-top:3px}
.rcard .pic{width:84px;height:62px;object-fit:contain;flex:none}
.ic{border-radius:50%;display:grid;place-items:center;font-size:22px;overflow:hidden}
.ic.e{background:#FCE6D6}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.tcard{display:flex;flex-direction:column;border:1.5px solid var(--line);border-radius:22px;background:#FFFDF9;overflow:hidden;cursor:pointer;text-align:left;box-shadow:0 2px 0 rgba(236,205,172,.45);transition:.15s}
.tcard:hover{border-color:var(--accent2);transform:translateY(-1px)}
.tcard .pic{height:104px;background:#FFF7EE;display:flex;align-items:flex-end;justify-content:center;overflow:hidden}
.tcard .pic img{max-height:100%;width:auto;max-width:100%}
.tcard .bd{padding:9px 12px 12px}
.tcard .nm{display:flex;align-items:center;gap:7px;font-weight:700;font-size:14.5px;line-height:1.3}
.tcard .nm .ic{width:28px;height:28px;font-size:15px;flex:none}
.tcard .meta{font-size:11.5px;color:var(--sub);margin-top:5px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.tcard .used{font-size:11.5px;color:var(--accent-d);margin-top:2px}
.sec{display:flex;align-items:center;justify-content:space-between;margin:24px 2px 10px}
.sec h3{font-size:16px;display:flex;align-items:center;gap:8px}
.sec h3 img{width:28px;height:28px}
.sec span{font-size:12px;color:var(--sub)}
/* 反馈 */
.fb{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.fb button{display:flex;align-items:center;justify-content:center;gap:5px;border:1.5px solid var(--line);background:#FFFDF9;border-radius:999px;padding:7px 0;cursor:pointer;font-size:13.5px;box-shadow:0 2px 0 rgba(236,205,172,.45)}
.fb button img{width:24px;height:24px}
.fb button.on{border-color:var(--accent);background:var(--soft);font-weight:700}
.fb.col{grid-template-columns:1fr}
.fb.col button{justify-content:flex-start;padding:10px 18px;font-size:15px;gap:10px}
.fb.col button img{width:28px;height:28px}
/* 导航 */
nav{position:fixed;left:0;right:0;bottom:0;background:rgba(255,251,245,.95);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border-top:1.5px solid var(--line);padding-bottom:env(safe-area-inset-bottom);z-index:5}
nav div{max-width:480px;margin:0 auto;display:grid;grid-template-columns:repeat(3,1fr)}
nav button{background:none;border:none;padding:7px 0 6px;font-size:12px;color:#8E8079;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:1px}
nav button svg{width:26px;height:26px;fill:none;stroke:#9A8B80;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;transition:.15s}
nav button.on{color:var(--accent-d);font-weight:700}
nav button.on svg{stroke:var(--accent-d);fill:#FCE3D3}
nav button.on svg .k{fill:#fff}
/* 回看 */
.chip{font-size:12px;color:var(--sub);border:1.5px solid var(--line);border-radius:999px;padding:2px 10px;background:#FFFDF9}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;text-align:center}
.stats div{background:#FFFDF9;border-radius:16px;padding:9px 4px;border:1.5px solid var(--line)}
.stats span{display:block;font-size:11.5px;color:var(--sub)}
.stats b{display:flex;align-items:center;justify-content:center;gap:4px;font-size:19px;min-height:30px}
.stats b img{width:26px;height:26px}
.bar{display:flex;align-items:center;gap:8px;font-size:13px;margin:9px 0}
.bar .n{width:58px;flex:none;display:flex;align-items:center;gap:4px}
.bar .n img{width:18px;height:18px}
.bar .track{flex:1;height:12px;border-radius:9px;background:#F5EADF;overflow:hidden}
.bar .fill{height:100%;border-radius:9px}
.bar .c{width:88px;flex:none;font-size:11.5px;color:var(--sub);text-align:right}
.insight{display:flex;gap:10px;padding:10px 0;border-bottom:1.5px dashed var(--line);font-size:14px;position:relative;z-index:1}
.insight:last-of-type{border:none}
.insight i{font-style:normal;font-size:17px;width:32px;height:32px;border-radius:50%;background:#FFF1E2;display:grid;place-items:center;flex:none}
.deco{position:absolute;right:8px;bottom:6px;width:96px;opacity:.9;pointer-events:none}
.entry{display:flex;gap:11px;padding:12px 0;border-bottom:1.5px solid #F6E8DA;cursor:pointer}
.entry:last-child{border:none}
.entry>img{width:36px;height:36px;flex:none}
.entry .tx{font-size:14px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.entry .mt{font-size:12px;color:var(--sub);display:flex;flex-wrap:wrap;align-items:center;gap:4px}
.pill{display:inline-block;font-size:11px;padding:0 8px;border-radius:99px;background:#F6EADF;color:var(--sub)}
.banner{background:#FFF3D6;border:1.5px solid #F4DFA8;color:#7A6232;font-size:12.5px;border-radius:14px;padding:8px 12px;margin-top:12px;display:flex;justify-content:space-between;align-items:center;gap:8px}
.banner button{background:none;border:none;color:var(--accent-d);font-weight:700;cursor:pointer;font-size:12.5px;white-space:nowrap}
/* 弹层 */
.mask{position:fixed;inset:0;background:rgba(74,59,50,.4);display:none;align-items:flex-end;justify-content:center;z-index:20}
.mask.show{display:flex}
.sheet{background:var(--bg);width:100%;max-width:480px;max-height:93vh;overflow:auto;border-radius:28px 28px 0 0;padding:18px 18px calc(24px + env(safe-area-inset-bottom));animation:up .28s ease;position:relative;background-image:radial-gradient(circle at 100% 0,#FCE6D6 0,transparent 45%)}
@keyframes up{from{transform:translateY(60px)}}
.x{position:absolute;right:14px;top:14px;background:#FFFDF9;border:1.5px solid var(--line);width:34px;height:34px;border-radius:50%;cursor:pointer;font-size:15px;z-index:2;color:var(--sub)}
.sh-h{text-align:center;padding:4px 40px 0}
.stage{text-align:center;padding:6px 0}
.orb{width:190px;height:190px;margin:22px auto 6px;border-radius:50%;display:grid;place-items:center;font-size:22px;font-weight:700;color:var(--accent-d);background:radial-gradient(circle,#FFFDF9 52%,#FDE3CF 53%,#FCEBDD 68%,rgba(252,235,221,0) 70%);transform:scale(.62);transition-property:transform;transition-timing-function:ease-in-out;box-shadow:0 0 0 14px rgba(242,181,140,.14),0 0 0 32px rgba(242,181,140,.07)}
.bcat{width:150px;margin:6px auto 0;transform-origin:50% 92%;transition-property:transform;transition-timing-function:ease-in-out;transform:scale(.96)}
.spic{max-width:250px;max-height:170px;margin:12px auto 4px;width:auto}
.prog{height:12px;background:#F5EADF;border-radius:9px;overflow:hidden;margin:14px 0 10px}
.prog div{height:100%;background:linear-gradient(90deg,var(--accent2),var(--accent));width:0;transition:width 1s linear;border-radius:9px}
.timer{font-size:42px;font-weight:700;letter-spacing:2px;font-variant-numeric:tabular-nums;margin:2px 0 14px}
.wave{display:flex;gap:4px;justify-content:center;align-items:center;height:56px;margin:14px 0}
.wave i{width:4px;border-radius:4px;background:var(--accent2);height:10px}
.wave.on i{animation:w 1.1s ease-in-out infinite}
@keyframes w{50%{height:48px;background:var(--accent)}}
.play{width:68px;height:68px;border-radius:50%;border:none;background:var(--accent);color:#fff;font-size:22px;cursor:pointer;box-shadow:0 4px 0 var(--accent-d);margin:4px auto 14px;display:grid;place-items:center}
.toast{position:fixed;left:50%;bottom:96px;transform:translateX(-50%);background:var(--ink);color:#fff;padding:9px 18px;border-radius:99px;font-size:13.5px;z-index:40;opacity:0;transition:.25s;pointer-events:none;white-space:nowrap}
.toast.show{opacity:1}
.sos{display:flex;align-items:center;gap:12px;background:#FFFDF9;border:1.5px solid var(--line);border-radius:20px;padding:10px 12px;margin-top:10px;text-decoration:none;color:var(--ink);box-shadow:0 2px 0 rgba(236,205,172,.45)}
.sos img{width:46px;height:46px;flex:none}
.sos div{flex:1;line-height:1.35}
.sos small{display:block;font-size:13px}
.sos b{display:block;font-size:21px;color:var(--accent-d);letter-spacing:.5px}
.sos em{font-style:normal;font-size:11.5px;color:var(--sub)}
.sos i{font-style:normal;color:#C9A994;font-size:20px}
.sh-cat{position:absolute;right:50px;top:12px;width:112px;pointer-events:none}
.sh-t{margin-top:30px;padding-right:150px;line-height:1.4}
.letter{background:#FFFDF9;border:1.5px solid var(--line);border-radius:18px;padding:16px 18px;font-size:15.5px;line-height:1.9;white-space:pre-wrap;margin:12px 0;background-image:repeating-linear-gradient(transparent 0 28px,#F6EADF 28px 29px)}
.lbl{font-size:14px;font-weight:700;margin:16px 0 8px;display:flex;align-items:center;gap:6px}
.hide{display:none!important}
svg text{font-family:inherit}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<div class="app">
  <header>
    <img class="logo" src="img/logo.webp" alt="心息 XinXi" width="440" height="197">
    <div class="date" id="today"></div>
  </header>
  <main id="view"></main>
</div>
<nav><div>
  <button data-tab="now" class="on"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3.5 10.6 12 3.5l8.5 7.1V19a1.5 1.5 0 0 1-1.5 1.5h-4.2v-5.6H9.2v5.6H5A1.5 1.5 0 0 1 3.5 19z"/></svg>此刻</button>
  <button data-tab="tools"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="7" width="18" height="13" rx="2.5"/><path d="M9 7V5.5A1.5 1.5 0 0 1 10.5 4h3A1.5 1.5 0 0 1 15 5.5V7M3 12.5h18"/><path d="M10.5 11h3v3h-3z" class="k"/></svg>工具箱</button>
  <button data-tab="review"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="4.5" y="3" width="15" height="18" rx="2.5"/><path d="M8.5 8h7M8.5 12h7M8.5 16h4" class="k"/></svg>回看</button>
</div></nav>
<div class="mask" id="mask"><div class="sheet" id="sheet"></div></div>
<div class="toast" id="toast"></div>

<script>
/* ========== 素材 ========== */
const ASSET_VER=2; // 替换图片后加 1，避免浏览器用旧缓存
const IMG=n=>`img/${n}.webp?v=${ASSET_VER}`;
const SEND_SVG='<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M22 2 11 13"/><path d="M22 2 15 22l-4-9-9-4z"/></svg>';

/* ========== 数据定义 ========== */
const MOODS=[
 {k:'焦虑',v:-1,c:'#EDA43F'},{k:'低落',v:-1,c:'#7FA4D6'},{k:'烦躁',v:-1,c:'#E8735A'},{k:'疲惫',v:-.7,c:'#A493D8'},
 {k:'说不清',v:0,c:'#B5A99E'},{k:'平静',v:.7,c:'#86B886'},{k:'开心',v:1,c:'#EDC23F'},{k:'感激',v:1,c:'#E8869A'}].map((m,i)=>({...m,img:IMG('mood-'+i)}));
const MOOD=Object.fromEntries(MOODS.map(m=>[m.k,m]));
const TRIG={学业:/考试|作业|论文|期末|上课|老师|成绩|学习|考研|绩点|答辩|复习|挂科|导师/,工作:/工作|领导|老板|加班|汇报|同事|项目|面试|实习|绩效|ddl|deadline|方案|上班|offer/i,人际:/朋友|室友|吵架|社交|误会|关系|孤独|冷落|群里|聚会|被说|别人/,家庭:/爸|妈|家里|父母|家人|催婚|亲戚/,恋爱:/男朋友|女朋友|对象|分手|喜欢的人|暧昧|恋爱|前任/,身体:/头疼|生病|身体|胃|疼|不舒服|感冒|发烧/,睡眠:/失眠|熬夜|睡不着|没睡|睡眠|早醒|困/,金钱:/钱|房租|工资|花呗|还款|穷|消费|存款/};
const TRIGS=[...Object.keys(TRIG),'说不清'];

function recommend(e){
 const list=REC[e.mood]||REC['说不清'],eff=effect(),sc={};
 Object.keys(TOOLS).forEach(id=>{let s=0,why='';const i=list.indexOf(id);if(i>=0){s+=10-i*1.5;why=`适合${e.mood}的时候`}
  if((MODECAT[e.mode]||[]).includes(TOOLS[id].cat))s+=3;
  (e.triggers||[]).forEach(t=>{if((TRIGBOOST[t]||[]).includes(id)){s+=2;why=why||`常用于缓解${t}压力`}});
  const f=eff[id];if(f&&f.n>=2){const r=(f.good-f.bad)/f.n;s+=r*5;if(r>.5)why=`用过 ${f.n} 次，${f.good} 次好一点`}
  sc[id]={s,why}});
 return Object.keys(sc).sort((a,b)=>sc[b].s-sc[a].s).slice(0,3).map(id=>({id,why:sc[id].why}));
}

  $('#go').onclick=()=>{$('#go').classList.add('hide');let r=0,i=0;const orb=$('#orb'),bc=$('#bcat');

    timers.push(setTimeout(()=>{clearInterval(iv);i++;if(i>=t.pattern.length){i=0;r++}tick()},s*1000))};tick()}}

function playSound(kind){
 AC=AC||new(window.AudioContext||window.webkitAudioContext)();AC.resume();
 const g=AC.createGain();g.gain.value=0;g.connect(AC.destination);g.gain.linearRampToValueAtTime(kind==='pad'?.9:.45,AC.currentTime+1.5);
 let stopper;
 if(kind==='pad'){const chords=[[130.8,261.6,329.6,392],[110,220,261.6,329.6],[87.3,174.6,220,261.6],[98,196,246.9,293.7]];
  const lp=AC.createBiquadFilter();lp.type='lowpass';lp.frequency.value=1400;lp.connect(g);
  const play=i=>chords[i%4].forEach(f=>{const o=AC.createOscillator(),og=AC.createGain();o.type='triangle';o.frequency.value=f;const t0=AC.currentTime;og.gain.setValueAtTime(0,t0);og.gain.linearRampToValueAtTime(.07,t0+2.5);og.gain.linearRampToValueAtTime(0,t0+8);o.connect(og);og.connect(lp);o.start(t0);o.stop(t0+8.2)});
  let ci=0;play(ci++);const iv=setInterval(()=>play(ci++),6000);stopper=()=>clearInterval(iv)}
 else{const len=AC.sampleRate*3,b=AC.createBuffer(1,len,AC.sampleRate),d=b.getChannelData(0);let last=0;
  for(let i=0;i<len;i++){const w=Math.random()*2-1;if(kind==='brown'){last=(last+.02*w)/1.02;d[i]=last*3.5}else d[i]=w*.6}
  const s=AC.createBufferSource();s.buffer=b;s.loop=true;let n=s;
  if(kind==='rain'){const hp=AC.createBiquadFilter();hp.type='highpass';hp.frequency.value=400;const lp=AC.createBiquadFilter();lp.type='lowpass';lp.frequency.value=2600;s.connect(hp);hp.connect(lp);n=lp;
   const lfo=AC.createOscillator(),lg=AC.createGain();lfo.frequency.value=.12;lg.gain.value=.12;lfo.connect(lg);lg.connect(g.gain);lfo.start();}
  n.connect(g);s.start();stopper=()=>{try{s.stop()}catch(e){}}}
 snd={stop:()=>{const t=AC.currentTime;g.gain.cancelScheduledValues(t);g.gain.setValueAtTime(g.gain.value,t);g.gain.linearRampToValueAtTime(0,t+.4);setTimeout(()=>{stopper();g.disconnect()},500)}};
}
function recordFb(fb){
 if(curTool){DB.toolLog=DB.toolLog||[];DB.toolLog.push({tool:curTool,fb,t:Date.now()});if(cur&&!cur.tool){cur.tool=curTool}}
 if(cur){cur.fb=fb;const e=DB.entries.find(x=>x.id===cur.id);if(e){e.fb=fb;e.tool=cur.tool}}
 save();
}

/* ========== 事件 ========== */
let tab='now';
function go(t){tab=t;document.querySelectorAll('nav button').forEach(b=>b.classList.toggle('on',b.dataset.tab===t));({now:renderNow,tools:renderTools,review:renderReview})[t]();window.scrollTo(0,0)}
document.addEventListener('click',ev=>{
 const el=ev.target.closest('[data-tab],[data-mood],[data-lv],[data-tag],[data-mode],[data-tool],[data-fb],[data-entry],[data-act]');if(!el)return;
 const d=el.dataset;
 if(d.tab)return go(d.tab);
 if(d.mood){draft.text=$('#txt')?.value||draft.text;draft.mood=draft.mood===d.mood?null:d.mood;return renderNow()}
 if(d.lv){draft.lvl=+d.lv;document.querySelectorAll('.lv').forEach(b=>b.classList.toggle('on',+b.dataset.lv===draft.lvl));return}
 if(d.tag){const k=d.tag;if(draft.tags.has(k)){draft.tags.delete(k);draft.removed.add(k)}else{draft.tags.add(k);draft.removed.delete(k)}const on=draft.tags.has(k);el.classList.toggle('on',on);el.style.background=on?TAGC[k]+'2B':'';el.style.borderColor=on?TAGC[k]:'';return}
 if(d.mode)return submit(d.mode);
 if(d.tool)return openTool(d.tool);
 if(d.fb){const inSheet=el.closest('#sheet');
  if(inSheet){recordFb(d.fb);closeSheet();if(tab==='now')renderNow();else go(tab);if(d.fb==='worse')return setTimeout(openWorse,250);toast('已记下，谢谢你照顾自己');return}
  curTool=null;recordFb(d.fb);el.parentNode.querySelectorAll('button').forEach(b=>b.classList.toggle('on',b===el));
  if(d.fb==='worse')return setTimeout(openWorse,350);toast(d.fb==='better'?'真好，已经保存到日记':'已保存，慢慢来');return}
 if(d.entry)return openEntry(d.entry);
 const a=d.act;
 if(a==='close')return closeSheet();
 if(a==='sos')return openSOS();
 if(a==='new'){cur=null;return go('now')}
 if(a==='tab-review'){cur=null;return go('review')}
 if(a==='to-tools'){closeSheet();return go('tools')}
 if(a==='more'){const v=$('#more').value.trim();if(!v)return;cur.follow=cur.follow||[];const extra=CRISIS.test(v);cur.follow.push({q:v,a:extra?'谢谢你告诉我这些，你现在的感受很重要。请先联系能马上帮到你的人，热线 24 小时都有人在。我也会在这里陪着你。':FOLLOW[cur.follow.length%FOLLOW.length]});cur.text+=(cur.text?'\n':'')+v;const nt=detect(v).filter(k=>!cur.triggers.includes(k));cur.triggers.push(...nt);save();renderResult();if(extra)setTimeout(openSOS,300);return}
 if(a==='del'){if(!confirm('确定删除这条记录吗？'))return;DB.entries=DB.entries.filter(e=>e.id!==d.id);save();closeSheet();toast('已删除');return go('review')}
 if(a==='saveedit'){const e=DB.entries.find(x=>x.id===d.id);e.text=$('#edit').value.trim();const nt=detect(e.text).filter(k=>!e.triggers.includes(k));e.triggers.push(...nt);save();closeSheet();toast('已保存');return go('review')}
 if(a==='clear'){if(!confirm('清空后无法恢复，确定吗？'))return;DB={entries:[],toolLog:[],sample:false};save();cur=null;toast('已清空，从今天开始吧');return go('review')}
 if(a==='demo'){DB=sample();save();toast('已载入示例数据');return go('review')}
});
document.addEventListener('keydown',e=>{if(e.key==='Enter'&&e.target.id==='more'){e.preventDefault();document.querySelector('[data-act="more"]').click()}});
$('#mask').addEventListener('click',e=>{if(e.target.id==='mask')closeSheet()});
const td=new Date();$('#today').innerHTML=`${td.getMonth()+1}月${td.getDate()}日 ${td.toLocaleDateString('zh-CN',{weekday:'long'})}<b>给心一点喘息的时间</b>`;
load();go('now');
</script>
